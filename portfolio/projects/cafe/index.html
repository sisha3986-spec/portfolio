<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artisan Coffee Roasters & Café</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #120e0c; color: #f2e9e4; font-family: 'Inter', sans-serif; padding: 2rem; }
    .header { text-align: center; margin-bottom: 3rem; }
    .title { font-family: 'Cormorant Garamond', serif; font-size: 3rem; letter-spacing: 0.12em; color: #d4a373; text-transform: uppercase; }
    .subtitle { font-size: 0.9rem; letter-spacing: 0.2em; color: #a3b18a; margin-top: 0.5rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem; max-width: 1000px; margin: 0 auto; }
    .card { background: #1e1b18; border: 1px solid rgba(212, 163, 115, 0.2); border-radius: 12px; overflow: hidden; }
    .card-img { width: 100%; height: 200px; object-fit: cover; }
    .card-body { padding: 1.5rem; }
    .card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: #d4a373; margin-bottom: 0.5rem; }
    .card-desc { font-size: 0.85rem; color: #dad7cd; line-height: 1.6; }
    .btn { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.2rem; background: #d4a373; color: #120e0c; text-decoration: none; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Artisan Roasters</h1>
    <p class="subtitle">SINGLE ORIGIN // HAND-CRAFTED BREWS // ORGANIC</p>
  </div>
  <div class="grid">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=800&q=80" alt="Specialty Espresso" class="card-img">
      <div class="card-body">
        <h3 class="card-title">Ethiopian Yirgacheffe</h3>
        <p class="card-desc">Floral jasmin aromatics paired with bright bergamot and delicate peach sweetness.</p>
        <a href="#" class="btn">ORDER BEANS</a>
      </div>
    </div>
    <div class="card">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80" alt="Pour Over Bar" class="card-img">
      <div class="card-body">
        <h3 class="card-title">Cold Drip Craft</h3>
        <p class="card-desc">Slow 12-hour cold water extraction yielding low-acidity velvety dark chocolate notes.</p>
        <a href="#" class="btn">VIEW MENU</a>
      </div>
    </div>
  </div>
</body>
</html>
